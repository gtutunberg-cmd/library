name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q -o library_app.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable

      - name: Build
        working-directory: library_app
        run: bash tool/ci.sh

      - uses: actions/upload-artifact@v4
        with:
          name: library-apk
          path: library_app/build/app/outputs/flutter-apk/app-release.apk
