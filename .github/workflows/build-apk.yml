name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project
        run: unzip -q library_app.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.27.4"
          channel: stable

      - name: Generate Android scaffold
        working-directory: library_app
        run: |
          flutter create --org kz.rinat --project-name ebook_reader --platforms=android .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Библиотека"/' android/app/src/main/AndroidManifest.xml

      - name: Get packages
        working-directory: library_app
        run: flutter pub get

      - name: Analyze
        working-directory: library_app
        run: flutter analyze || true

      - name: Build APK
        working-directory: library_app
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: library-apk
          path: library_app/build/app/outputs/flutter-apk/app-release.apk
